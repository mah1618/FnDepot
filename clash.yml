mixed-port: 7890
redir-port: 7892
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090

# ================= DNS =================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  use-hosts: true

  nameserver:
    - 127.0.0.1:1053

  fallback:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
    - https://dns.quad9.net/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN

# ================= 节点（改名，避免冲突） =================
proxies:
  - name: JP-Node
    type: vless
    server: 154.83.94.158
    port: 443
    uuid: cbad8509-24a8-4253-81f6-049642a38f8e
    network: tcp
    udp: false
    tls: true
    servername: www.apple.com
    reality-opts:
      public-key: 2Yj98PHRZeSS2_zBa49KMG8x1-3sNgGfjP_y9P0f0Wo
      short-id: "c6cc"
    client-fingerprint: chrome

  - name: DE-Node
    type: vless
    server: 156.226.174.40
    port: 443
    uuid: f38b2c53-ef92-46d8-b2db-6d89cd60c473
    network: tcp
    udp: false
    tls: true
    servername: www.intel.com
    flow: ""
    reality-opts:
      public-key: yz_6OTvPmMIwMrbMEIlSA88xrhxFPGyHNivF6p-K7Us
      short-id: "3bdf39"
    client-fingerprint: chrome


  - name: HK-Node
    type: vless
    server: 45.207.157.141
    port: 443
    uuid: 1ea1ff0c-878d-4bac-9c67-a05d290db37e
    network: tcp
    udp: false
    tls: true
    servername: www.nvidia.com
    flow: ""
    reality-opts:
      public-key: Fc0ax_RJw4VZyBhnzzvIpVEj-0HdFtta5JE040kyfH4
      short-id: "a4d2f29e"
    client-fingerprint: chrome

# ================= 代理组 =================
proxy-groups:
  - name: Auto
    type: fallback
    proxies:
      - JP-Node
      - DE-Node
      - HK-Node
    url: http://1.1.1.1/generate_204
    interval: 300

  - name: Japan
    type: select
    proxies:
      - JP-Node

  - name: Germany
    type: select
    proxies:
      - DE-Node

  - name: HongKong
    type: select
    proxies:
      - HK-Node

  - name: CN-Fallback
    type: select
    proxies:
      - DIRECT
      - HK-Node

  - name: Switch
    type: select
    proxies:
      - Auto
      - Japan
      - Germany
      - HongKong
      - DIRECT

  - name: Netflix
    type: select
    proxies:
      - Japan
      - Germany

  - name: Bahamut
    type: select
    proxies:
      - HongKong
      - Japan

  - name: CN
    type: select
    proxies:
      - DIRECT

